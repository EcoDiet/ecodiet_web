name: eco_diet_v0
description: A new Flutter project.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.3.1
  logger: ^2.0.2
  email_validator: ^3.0.0
  crypto: ^3.0.3
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_dotenv: ^6.0.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo/EcoDiet-Logo.png
    - lib/assets/logo/EcoDiet-Logo-beige.png
    - assets/env.development
    - assets/env.production
    # Inter et Montserrat (graisses 400 à 800) servies avec l'app : google_fonts
    # les lit ici au lieu de les télécharger depuis fonts.gstatic.com.
    - assets/fonts/
